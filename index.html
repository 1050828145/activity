<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活动报名</title>
    <style>
      /* 初始加载状态样式 */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: hsl(var(--background, 0 0% 100%));
        z-index: 9999;
      }
      
      #initial-loader.hidden {
        display: none;
      }
      
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid hsl(var(--muted, 240 4.8% 95.9%));
        border-top-color: hsl(var(--primary, 221.2 83.2% 53.3%));
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .loader-text {
        margin-top: 16px;
        font-size: 14px;
        color: hsl(var(--muted-foreground, 240 3.8% 46.1%));
      }
      
      /* 暗色模式支持 */
      @media (prefers-color-scheme: dark) {
        #initial-loader {
          background-color: hsl(222.2 84% 4.9%);
        }
      }
    </style>
  </head>
  <body>
    <!-- 初始加载状态 -->
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <p class="loader-text">加载中...</p>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
